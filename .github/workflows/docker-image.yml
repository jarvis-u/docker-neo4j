name: Docker Image CI

on:
  push:
    branches: [ "release-5.26.0" ]
  pull_request:
    branches: [ "release-5.26.0" ]

jobs:

  build:

    runs-on: ubuntu-latest
    env:
      NEO4JVERSION: 5.26.0
      SYSTEM: debian
    steps:
      - uses: actions/checkout@v4
        name: Checkout code

      - name: Login to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the Docker image
        run: make build-${{ env.SYSTEM }}-community

      - name: Tag the Docker image step 1
        run: make tag-${{ env.SYSTEM }}-community

      - name: Tag the Docker image step 2
        run: docker tag neo4j:${{ env.NEO4JVERSION }}-${{ env.SYSTEM }} ghcr.io/shouqianba-ft/neo4j:${{ env.NEO4JVERSION }}-community

      - name: Push the Docker image
        run: docker push ghcr.io/jarvis-u/neo4j:${{ env.NEO4JVERSION }}-community